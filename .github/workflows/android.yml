name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx cap add android
      - name: Dikey ekran ve ikon
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          for d in android/app/src/main/res/mipmap-*; do
            cp www/icon-192.png "$d/ic_launcher.png"
            cp www/icon-192.png "$d/ic_launcher_round.png"
            cp www/icon-192.png "$d/ic_launcher_foreground.png"
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk cagri-simulator.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cagri-simulator-apk
          path: cagri-simulator.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Çağrı Simülatör APK
          body: Android'e indirip kur (Bilinmeyen kaynaklara izin ver).
          files: cagri-simulator.apk
          make_latest: true
