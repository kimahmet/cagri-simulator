<!doctype html>

<title>Çağrı Simülatör</title>
<style>
/* font yerel: APK internetsiz de çalışsın */
@font-face{font-family:'Press Start 2P';src:url(ps2p-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Press Start 2P';src:url(ps2p-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
</style>
<style>
/* Single dark arcade look: one portrait canvas, pixel-scaled to fit the screen */
:root { --bg:#0d0716; color-scheme:dark }
html,body { height:100%; margin:0; background:var(--bg); overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent }
#wrap { height:100%; display:flex; align-items:center; justify-content:center }
canvas { image-rendering:pixelated; image-rendering:crisp-edges; display:block; background:#000; outline:none }
</style>

<body>
<div id="wrap"><canvas id="c" width="180" height="320" tabindex="0" aria-label="Çağrı Simülatör oyunu. Alttaki üç tuşa ya da A S D tuşlarına bas."></canvas></div>
<script>
// ======= AYARLAR =======
const NAME = "ÇAĞRI";          // başlık ve yazılarda büyük harf
const NM = "Çağrı";            // hikaye metinlerinde
// lavukluk barı: 0..100, her isabette dolar
const addLav = n => { lav = Math.min(100, lav + n); };
// Son şarkıda sol üstte inen yazılar. t = bölüm başından saniye (şarkı ~39 sn).
// Söz eklemek için: { t: 4, s: 'satır' } gibi satır ekle.
const LYRICS = [
  { t: 0.5, s: 'TEOMAN - PARAMPARÇA' },
];

// ======= TEMEL =======
const W = 180, H = 320;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const wrap = document.getElementById('wrap');
function fit() { const s = Math.min(wrap.clientWidth / W, wrap.clientHeight / H); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; }
addEventListener('resize', fit); fit();
const FONT = s => `${s}px "Press Start 2P", monospace`;
document.fonts && document.fonts.load(FONT(8), "AĞŞİÇÖÜ");

const LANE_X = [36, 90, 144], LANE_COL = ['#ff4d6d', '#ffd23f', '#3fa7ff'], LANE_DARK = ['#9e2240', '#a8801a', '#1f5fa3'];
const SCN0 = 14, SCN1 = 168, LANE_TOP = 168, HITY = 262, PANEL = 276, BTN_Y = 297, TRAVEL = 1.4, LEAD = 4;
const SPEED = (HITY - LANE_TOP) / TRAVEL;

function txt(s, x, y, col = '#fff', align = 'left', size = 8, shadow = '#000') {
  g.font = FONT(size); g.textAlign = align; g.textBaseline = 'top';
  if (shadow) { g.fillStyle = shadow; g.fillText(s, Math.round(x) + 1, Math.round(y) + 1); }
  g.fillStyle = col; g.fillText(s, Math.round(x), Math.round(y));
}
function wrapText(s, maxW) {
  g.font = FONT(8); const out = []; let cur = '';
  for (const w of s.split(' ')) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }
  if (cur) out.push(cur); return out;
}
const rect = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
const circ = (x, y, r, c) => { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); };
const fmt = n => Math.round(n).toLocaleString('tr-TR');
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ======= KARAKTER (uzun boylu, kefiyeli) =======
const HERO = [
  "....KKKKKKK.....", "..KKHHHHHHHKK...", ".KHHHHHHHHHHHK..", "KHHHHHHHHHHHHHK.", "KHHHHHHHHHHHHHK.",
  "KHHSHHHHSHHHHHK.", ".KHSSSSSSSSSHHK.", ".KSSSSSSSSSSSHK.", ".KSSKKSSSKKSSSK.", ".KSSKWSSSKWSSSK.",
  ".KSSSSSSSSSSSSK.", ".KsSSSSSSSSSSsK.", "..KSSSSsSSSSSK..", "..KSSSSKKSSSSK..", "...KKSSSSSSKK...",
  "....KKSSSSKK....", "...KRWRWRWRWK...", "..KWRWRWRWRWRK..", ".KTRWRWRWRWRWTK.", ".KTTWRWRWRWRTTK.",
  ".KTTTRWRTTTTTTK.", ".KTtTWRWTTTTtTK.", ".KTtTRWRTTTTtTK.", ".KTtTWRWTTTTtTK.", ".KTtTKRKTTTTtTK.",
  ".KTtTTTTTTTTtTK.", ".KTtTTTTTTTTtTK.", ".KSKTTTTTTTTKSK.", ".KSKJJJJJJJJKSK.", "..KKJJJJJJJJKK..",
  "...KJJJJJJJJK...", "...KJJJKKJJJK...", "...KJJjKKJJjK...", "...KJJjKKJJjK...", "...KJJjKKJJjK...",
  "...KJJjKKJJjK...", "...KJJjKKJJjK...", "...KJJjKKJJjK...", "...KJJjKKJJjK...", "...KJJJKKJJJK...",
  "..KBBBBKKBBBBK..", "..KGGGGKKGGGGK..", "..KKKKKKKKKKKK.."];
const PAL = { K: '#1a1020', H: '#3b2416', S: '#f2c39b', s: '#d99a72', W: '#f4efe6', R: '#c8202f', T: '#2e5a4a', t: '#22443a', J: '#2d3f73', j: '#22305a', B: '#ececec', G: '#8a8a9a' };
const RIVAL = { H: '#a8a8b0', S: '#d4a07a', s: '#b07d58', R: '#303030', W: '#7a7a7a', T: '#6b2f2f', t: '#4f2222', J: '#3a3a3a', j: '#2a2a2a', B: '#5a3a2a', G: '#3a2a1a' };
const cache = {};
function sprite(key) {
  if (cache[key]) return cache[key];
  const over = key === 'rival' ? RIVAL : {}, c = document.createElement('canvas'); c.width = 16; c.height = HERO.length;
  const x = c.getContext('2d');
  HERO.forEach((row, r) => [...row].forEach((ch, col) => { if (ch !== '.') { x.fillStyle = over[ch] || PAL[ch]; x.fillRect(col, r, 1, 1); } }));
  return cache[key] = c;
}
// cx = merkez, feet = ayak hizası; karakterin tepe y'sini döndürür
function drawChar(key, cx, feet, sc = 2) {
  const img = sprite(key), x = Math.round(cx - 8 * sc), y = Math.round(feet - img.height * sc);
  g.imageSmoothingEnabled = false; g.drawImage(img, x, y, 16 * sc, img.height * sc);
  if (key === 'rival') rect(x + 4 * sc, y + 12 * sc, 7 * sc, sc, '#e6e6ea'); // bıyık
  return y;
}
function scarfFlutter(cx, top, sc, t) { // kefiye ucu rüzgarda
  const f = Math.sin(t * 6) > 0 ? 1 : 0;
  for (let i = 0; i < 4; i++) rect(cx + 6 * sc + i * sc * 1.5, top + (17 + i + f * (i % 2)) * sc, sc * 1.5, sc, i % 2 ? '#f4efe6' : '#c8202f');
}

// ======= SES =======
let actx = null, master, noiseBuf;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = .45; master.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate * .6, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { actx = null; }
}
const now = () => actx ? actx.currentTime : performance.now() / 1000;
function tone(at, f, dur, type = 'square', vol = .1, slide) {
  if (!actx) return; const o = actx.createOscillator(), v = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, at); if (slide) o.frequency.exponentialRampToValueAtTime(slide, at + dur);
  v.gain.setValueAtTime(vol, at); v.gain.exponentialRampToValueAtTime(.0001, at + dur);
  o.connect(v).connect(master); o.start(at); o.stop(at + dur + .02);
}
function noise(at, dur, vol, freq, type = 'highpass') {
  if (!actx) return; const s = actx.createBufferSource(), f = actx.createBiquadFilter(), v = actx.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
  v.gain.setValueAtTime(vol, at); v.gain.exponentialRampToValueAtTime(.0001, at + dur);
  s.connect(f).connect(v).connect(master); s.start(at); s.stop(at + dur + .02);
}
const blip = (f = 660) => tone(now(), f, .08, 'square', .06);

// ======= HİKAYE & BÖLÜMLER =======
const LEVELS = [
  { name: 'MAHALLE POTASI', bg: 'court', bpm: 100, bars: 14, seed: 3, density: .45, eighths: false, shots: true, bass: [55, 55, 65.4, 49] },
  { name: 'DUMAN KRALI', bg: 'cafe', bpm: 112, bars: 14, seed: 7, density: .5, eighths: true, bass: [41.2, 41.2, 49, 55] },
  { name: 'SON ŞARKI', bg: 'stage', bpm: 104, bars: 16, seed: 11, density: .6, eighths: true, bass: [82.4, 98, 110, 73.4] },
];
const STEPS = [
  { t: 'story', bg: 'room', lines: [
    `Bugün ${NM}'nın doğum günü!`,
    `Ve ${NM}'nın bugün sıkıntıdan patlamaması için yapması gereken 3 önemli görev var.`,
    `Hedef: başarmak.`,
    `Kefiyeyi tak. Hadi başlayalım!`] },
  { t: 'story', bg: 'court', title: 'BÖLÜM 1', sub: 'MAHALLE POTASI', lines: [
    `İlk durak: mahallenin efsane potası.`,
    `Her ölçüde bir şut. Metre dolarken izle, tam yeşildeyken bir kez bas!`,
    `Erken ya da geç kalma. Yeşili yakala, ${NM}!`] },
  { t: 'play', lvl: 0 },
  { t: 'story', bg: 'cafe', title: 'BÖLÜM 2', sub: 'DUMAN KRALI', rival: true, lines: [
    `Robin Hood'un arka masasında bir efsane bekliyor: Dumancı Baba.`,
    `BABA: "Evlat, bu masada benden büyük bulut çıkaran olmadı."`,
    `Ritmi tuttur, bulutunu büyüt, Babayı tahtından indir!`] },
  { t: 'play', lvl: 1 },
  { t: 'story', bg: 'stage', title: 'BÖLÜM 3', sub: 'SON ŞARKI', lines: [
    `Artık son şarkı zamanı. Işıklar kısıldı, sahnede tek bir bar taburesi.`,
    `${NM} taburesine oturdu, gitarı kucağına aldı.`,
    `ÇAĞRI: "Herkese geldiği için teşekkür ederim."`,
    `ÇAĞRI: "Son şarkı olarak... Teoman, Paramparça."`,
    `Salon sustu. Telefon ışıkları yandı. ${NM} ilk akoru bastı...`] },
  { t: 'play', lvl: 2 },
  { t: 'story', bg: 'cafe', title: 'BONUS', sub: 'ŞAH MAT', rival: true, lines: [
    `Konser bitti ama gece bitmedi. Robin Hood'a dönüş.`,
    `BABA: "Evlat, bir de satrançta görelim seni."`,
    `BABA: "Tek hamlede mat edersen puanını ikiye katlarım. 3 hakkın var."`] },
  { t: 'chess' },
  { t: 'end' },
];

let scene = 'title', step = -1, story = null, P = null, lav = 0, sceneT = 0, confetti = [];
let scores = [0, 0, 0], total = 0, best = 0, newBest = false, bonus = false, C = null;
function rankName(l) { return l < 25 ? 'ÇIRAK LAVUK' : l < 50 ? 'MAHALLE LAVUĞU' : l < 75 ? 'PROFESYONEL LAVUK' : 'LAVUKLARIN KRALI'; }
function go(i) {
  step = i; sceneT = 0; const s = STEPS[i];
  if (!s) { scene = 'title'; return; }
  if (s.t === 'story') { scene = 'story'; story = { s, line: 0, chars: 0 }; }
  else if (s.t === 'play') startLevel(s.lvl);
  else if (s.t === 'chess') startChess();
  else {
    scene = 'end'; confetti = []; total = (scores.reduce((a, b) => a + b, 0) + Math.round(lav) * 100) * (bonus ? 2 : 1);
    try { best = +localStorage.getItem('cagri-best') || 0; newBest = total > best; if (newBest) { best = total; localStorage.setItem('cagri-best', total); } } catch (e) { best = total; newBest = false; } tone(now(), 523, .15, 'square', .08); tone(now() + .15, 659, .15, 'square', .08); tone(now() + .3, 784, .4, 'square', .08); }
}

function makeChart(L) {
  const r = rng(L.seed), b = 60 / L.bpm, out = []; let prev = -1;
  if (L.shots) { for (let k = 0; k < L.bars; k++) out.push({ t: (LEAD + k * 4) * b, lane: 1, judged: false }); return out; } // her ölçüde bir şut
  for (let s = 0; s < L.bars * 8; s++) {
    const p = s % 2 === 0 ? L.density + .25 : (L.eighths ? L.density * .6 : 0);
    if (r() < p) {
      let lane = Math.floor(r() * 3);
      if (lane === prev && r() < .5) lane = (lane + 1 + Math.floor(r() * 2)) % 3;
      prev = lane; out.push({ t: (LEAD + s / 2) * b, lane, judged: false });
    }
  }
  return out;
}
function startLevel(i) {
  const L = LEVELS[i], notes = makeChart(L);
  scene = 'play';
  P = { i, L, notes, beat: 60 / L.bpm, start: now() + .4, nextHalf: 0, totalHalf: (LEAD + L.bars * 4) * 2,
    endTime: notes[notes.length - 1].t + 1.5, phase: 'play', score: 0, combo: 0, maxCombo: 0, hits: 0, perfects: 0, misses: 0,
    lav0: lav, parts: [], pops: [], balls: [], hero: 0, rival: 0, ri: 0, flash: [0, 0, 0], pressed: [0, 0, 0], jump: 0, light: 0, doneAt: 0 };
}
function schedule() {
  if (!actx) return; const L = P.L, half = P.beat / 2;
  while (P.nextHalf < P.totalHalf && P.start + P.nextHalf * half < actx.currentTime + .15) {
    const i = P.nextHalf, at = P.start + i * half, beat = i >> 1, bar = beat >> 2;
    if (i % 2 === 0) { tone(at, 150, .14, 'sine', .45, 40); tone(at, L.bass[bar % 4] * (beat % 2 ? 2 : 1), P.beat * .8, 'triangle', .22); if (beat % 4 === 2) noise(at, .12, .12, 1500, 'bandpass'); }
    noise(at, .03, i % 2 ? .03 : .05, 7000);
    if (i < LEAD * 2 && i % 2 === 0) tone(at, beat === LEAD - 1 ? 1320 : 880, .06, 'square', .05);
    P.nextHalf++;
  }
}
function press(lane) {
  if (!P || scene !== 'play') return;
  P.pressed[lane] = .12; P.flash[lane] = 1;
  if (P.phase !== 'play') return;
  const st = now() - P.start; let best = null, bd = 9;
  for (const n of P.notes) if (!n.judged && (P.i === 0 || n.lane === lane)) { const d = Math.abs(n.t - st); if (d < bd) { bd = d; best = n; } }
  if (P.i === 0) { // 2K tarzı şut metresi: metre dolarken tek basış, yeşil = tam zamanında
    if (!best || best.t - st > FILL) return; // metre dolmuyorken basış boşa gider
    best.judged = true;
    const d = best.t - st, ad = Math.abs(d), perfect = ad <= GREEN;
    if (ad > .2) { onMiss(); P.meter.h = meterFill(d); pop('ÇOK ERKEN', 40, PANEL - 170, '#ff4d6d'); return; }
    best.hit = true; P.meter = { h: meterFill(d), col: perfect ? '#3cff6e' : '#ffd23f', life: .45 };
    addScore(perfect ? 100 : 60, perfect ? .6 : .35, perfect);
    pop(perfect ? 'YEŞİL!' : d > 0 ? 'ERKEN' : 'GEÇ', 40, PANEL - 170, perfect ? '#3cff6e' : '#ffd23f');
    onHit(lane, perfect); return;
  }
  if (!best || bd > .22) { tone(now(), 200, .04, 'square', .02); return; }
  best.judged = true; best.hit = true;
  const perfect = bd <= .07, good = bd <= .13; // Muse Dash gibi: geç/erken basış da sayılır, OK yazar
  addScore(perfect ? 100 : good ? 60 : 30, perfect ? .6 : good ? .35 : .2, perfect);
  pop(perfect ? 'SÜPER!' : good ? 'İYİ' : 'OK', LANE_X[lane], HITY - 22, perfect ? '#ffd23f' : good ? '#fff' : '#7ee08a');
  onHit(lane, perfect);
}
function addScore(pts, lv, perfect) {
  P.hits++; if (perfect) P.perfects++; P.combo++; P.maxCombo = Math.max(P.maxCombo, P.combo);
  P.score += pts * (1 + Math.min(P.combo, 30) / 30); addLav(lv);
}
function onMiss() {
  P.combo = 0; P.misses++;
  tone(now(), 110, .15, 'square', .05, 70);
  if (P.i === 0) { P.balls.push({ t0: sceneT, miss: true }); P.meter = { h: 80, col: '#ff4d6d', life: .45 }; }
}
function onHit(lane, perfect) {
  const t = now();
  if (P.i === 0) { P.balls.push({ t0: sceneT, miss: false, perfect }); P.jump = .35; tone(t, 90, .12, 'sine', .4, 60); }
  if (P.i === 1) {
    P.hero += perfect ? 1 : .6; noise(t, .35, .18, 900, 'lowpass');
    puff(40, SCN1 - 6 - 86 + 26, 1, perfect ? 7 : 4, perfect);
  }
  if (P.i === 2) {
    const sc = [329.6, 392, 440, 493.9, 587.3], f = sc[(lane * 2 + P.combo) % 5] * (perfect ? 1 : .5) * (P.combo > 20 ? 2 : 1);
    tone(t, f, .35, 'sawtooth', .07); tone(t, f * 1.005, .3, 'square', .04);
    P.light = 1; P.parts.push({ kind: 'note', x: 90 + (lane - 1) * 20, y: SCN1 - 60, vx: (lane - 1) * 10, vy: -30, life: 1.2, max: 1.2, col: LANE_COL[lane] });
  }
}
// şut metresi: şuttan FILL sn önce dolmaya başlar (0..80px); 72px = tam vakit, yeşil bölge ±GREEN sn
const FILL = 1.2, GREEN = .09;
const meterFill = dt => dt > FILL ? 0 : Math.max(0, Math.min(80, 72 * (1 - dt / FILL)));
function drawMeter(x, y1, st, k = 1) {
  const M = 80 * k, w = 6 * k, hit = 72 * k, zone = GREEN / FILL * hit;
  rect(x - 1, y1 - M - 1, w + 2, M + 2, '#000'); rect(x, y1 - M, w, M, '#2a2a3a');
  let h, col;
  if (P.meter && P.meter.life > 0) { h = P.meter.h; col = P.meter.col; }
  else { const n = P.notes.find(n => !n.judged); h = n ? meterFill(n.t - st) : 0; col = '#f4efe6'; }
  rect(x, y1 - h * k, w, h * k, col);
  rect(x - 2, y1 - hit - zone, w + 4, zone * 2, 'rgba(60,255,110,.55)'); rect(x - 2, y1 - hit, w + 4, 1, '#3cff6e');
}
function drawSitting(cx, seat, sc = 2) { // bar taburesinde oturan Çağrı
  const img = sprite('hero'), x = Math.round(cx - 8 * sc), y = Math.round(seat - 29 * sc);
  rect(cx - 12, seat + 3, 3, 30, '#3a2a20'); rect(cx + 9, seat + 3, 3, 30, '#3a2a20'); rect(cx - 12, seat + 18, 24, 2, '#3a2a20');
  rect(cx - 15, seat - 2, 30, 5, '#6a4430'); rect(cx - 15, seat - 2, 30, 1, '#9a6a48');
  g.imageSmoothingEnabled = false; g.drawImage(img, 0, 0, 16, 29, x, y, 16 * sc, 29 * sc);
  rect(x + 3 * sc, seat, 10 * sc, 3 * sc, '#1a1020'); rect(x + 4 * sc, seat, 8 * sc, 2 * sc, PAL.J);
  for (const lx of [3, 9]) { rect(x + lx * sc, seat + 2 * sc, 4 * sc, 7 * sc, '#1a1020'); rect(x + (lx + 1) * sc, seat + 2 * sc, 2 * sc, 7 * sc, PAL.J);
    rect(x + lx * sc - 2, seat + 9 * sc - 2, 4 * sc + 2, 2 * sc, '#ececec'); }
  return y;
}
function puff(x, y, dir, n, ring) {
  for (let k = 0; k < n; k++) P.parts.push({ kind: 'smoke', x: x + dir * 4, y, vx: dir * (10 + Math.random() * 25), vy: -6 - Math.random() * 14, r: 2 + Math.random() * 2, grow: 5 + Math.random() * 5, life: 2.2, max: 2.2 });
  if (ring) P.parts.push({ kind: 'ring', x: x + dir * 8, y, vx: dir * 22, vy: -10, r: 2, grow: 8, life: 1.6, max: 1.6 });
}
function pop(text, x, y, col) { P.pops.push({ text, x, y, col, life: .6 }); }
function finish() {
  P.phase = 'done'; P.doneAt = sceneT; scores[P.i] = Math.round(P.score);
  const acc = P.hits / P.notes.length;
  P.acc = acc; P.grade = acc >= .95 ? 'S' : acc >= .85 ? 'A' : acc >= .7 ? 'B' : acc >= .5 ? 'C' : 'D';
  tone(now(), 523, .12, 'square', .06); tone(now() + .12, 784, .25, 'square', .06);
}

// ======= GİRDİ =======
function tap(x, y) {
  if (scene === 'title') { blip(); go(0); return; }
  if (scene === 'story') {
    const full = story.s.lines[story.line].length;
    if (story.chars < full) story.chars = full;
    else { blip(520); story.line++; story.chars = 0; if (story.line >= story.s.lines.length) go(step + 1); }

  for (const c of confetti) { rect(c.x + Math.sin(t * 3 + c.w) * 3, c.y, 2, 3, c.c); }
  rect(0, 16, W, 76, 'rgba(10,4,20,.8)');
  txt('İYİ Kİ', 90, 22, '#ffd23f', 'center', 16); txt('DOĞDUN', 90, 42, '#ffd23f', 'center', 16);
  txt(NAME + '!', 90, 64, '#fff', 'center');
  rect(10, 98, 160, 92, '#ff6ad5'); rect(12, 100, 156, 88, '#1a0f2e');
  txt('LAVUKLUK PUANI', 90, 106, '#ff6ad5', 'center');
  txt(fmt(total), 90, 120, '#ffd23f', 'center', 16, '#000');
  txt(rankName(lav), 90, 142, '#fff', 'center');
  txt('BAR %' + Math.round(lav) + (bonus ? '  BONUS x2' : ''), 90, 156, '#b8a8d8', 'center', 6, null);
  txt(newBest ? 'YENİ REKOR!' : 'REKOR ' + fmt(best), 90, 170, newBest ? '#7ee08a' : '#b8a8d8', 'center', 6, null);
  if (sceneT > 1.5 && Math.floor(t * 2) % 2 === 0) txt('TEKRAR OYNA', 90, 198, '#fff', 'center');
}

// ======= BONUS: SATRANÇ (tek hamlede mat) =======
const PIECE = {
  P: [".........", "....#....", "...###...", "...###...", "....#....", "...###...", "..#####..", ".#######.", ".#######."],
  N: [".........", "...##....", "..####...", ".##.####.", ".#######.", "....####.", "...####..", "..#####..", ".#######."],
  B: ["....#....", "...###...", "..##.##..", "..#.###..", "..#####..", "...###...", "....#....", "..#####..", ".#######."],
  R: [".#.#.#.#.", ".#######.", "..#####..", "..#####..", "..#####..", "..#####..", "..#####..", ".#######.", ".#######."],
  Q: ["#..#.#..#", "#.#####.#", ".#######.", ".#######.", "..#####..", "..#####..", "...###...", ".#######.", ".#######."],
  K: ["....#....", "...###...", "....#....", ".##.#.##.", "#########", ".#######.", "..#####..", ".#######.", ".#######."],
};
const BX = 10, BY = 74, SQ = 20;
function startChess() {
  scene = 'chess'; const B = [];
  const put = (sq, type, white) => B.push({ f: sq.charCodeAt(0) - 97, r: +sq[1] - 1, type, white });
  [['g1', 'K'], ['d1', 'Q'], ['c1', 'B'], ['g5', 'N'], ['a2', 'P'], ['b2', 'P'], ['f2', 'P'], ['g2', 'P'], ['h2', 'P']].forEach(([q, t]) => put(q, t, true));
  [['h8', 'K'], ['g8', 'R'], ['a8', 'R'], ['a5', 'Q'], ['a7', 'P'], ['b7', 'P'], ['g7', 'P'], ['h7', 'P']].forEach(([q, t]) => put(q, t, false));
  C = { B, sel: null, tries: 3, state: 'play', msg: 'Beyaz oynar. Bir taşa dokun, sonra gideceği kareye.', t: 0 };
}
const pieceAt = (f, r) => C.B.find(p => p.f === f && p.r === r);
function moves(p) { // beyaz taşın kurallara uygun hedefleri (şah güvenliği hariç)
  const out = [], on = (f, r) => f >= 0 && f < 8 && r >= 0 && r < 8;
  const add = (f, r) => { if (!on(f, r)) return false; const q = pieceAt(f, r); if (q && q.white) return false; out.push([f, r]); return !q; };
  const slide = dirs => dirs.forEach(([df, dr]) => { let f = p.f + df, r = p.r + dr; while (add(f, r)) { f += df; r += dr; } });
  const D = [[1, 1], [1, -1], [-1, 1], [-1, -1]], O = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  if (p.type === 'R') slide(O); if (p.type === 'B') slide(D); if (p.type === 'Q') slide([...O, ...D]);
  if (p.type === 'K') [...O, ...D].forEach(([df, dr]) => add(p.f + df, p.r + dr));
  if (p.type === 'N') [[1, 2], [2, 1], [-1, 2], [-2, 1], [1, -2], [2, -1], [-1, -2], [-2, -1]].forEach(([df, dr]) => add(p.f + df, p.r + dr));
  if (p.type === 'P') {
    if (!pieceAt(p.f, p.r + 1)) { out.push([p.f, p.r + 1]); if (p.r === 1 && !pieceAt(p.f, p.r + 2)) out.push([p.f, p.r + 2]); }
    for (const df of [-1, 1]) { const q = pieceAt(p.f + df, p.r + 1); if (q && !q.white) out.push([p.f + df, p.r + 1]); }
  }
  return out;
}
function chessTap(x, y) {
  if (C.state !== 'play') { if (C.t > .8) { blip(); go(step + 1); } return; }
  const f = Math.floor((x - BX) / SQ), r = 7 - Math.floor((y - BY) / SQ);
  if (f < 0 || f > 7 || r < 0 || r > 7) return;
  const q = pieceAt(f, r);
  if (q && q.white) { C.sel = q; blip(700); return; }
  if (!C.sel || !moves(C.sel).some(([mf, mr]) => mf === f && mr === r)) return;
  const p = C.sel; C.sel = null;
  if (p.type === 'N' && f === 5 && r === 6) { // Af7# : boğulmuş mat (şahın kaçacak karesi yok)
    p.f = f; p.r = r; C.state = 'win'; C.t = 0; bonus = true; C.msg = 'ŞAH MAT! Boğulmuş mat. Puanın 2 katı!';
    [523, 659, 784, 1047].forEach((n, k) => tone(now() + k * .12, n, .2, 'square', .07));
  } else {
    C.tries--; tone(now(), 110, .2, 'square', .06, 70);
    if (C.tries > 0) C.msg = `Mat değil! ${C.tries} hakkın kaldı.`;
    else { C.state = 'lose'; C.t = 0; C.msg = 'Haklar bitti. Doğrusu: At f7, boğulmuş mat.'; const n = pieceAt(6, 4); n.f = 5; n.r = 6; }
  }
}
function drawPiece(p, x, y) {
  const rows = PIECE[p.type], fill = p.white ? '#f4efe6' : '#2a1840', line = p.white ? '#1a1020' : '#e6d8ff';
  rows.forEach((row, r) => [...row].forEach((ch, c) => { if (ch === '#') rect(x + c * 2 - 1, y + r * 2 - 1, 4, 4, line); }));
  rows.forEach((row, r) => [...row].forEach((ch, c) => { if (ch === '#') rect(x + c * 2, y + r * 2, 2, 2, fill); }));
}
function renderChess(t) {
  drawBg('cafe', 0, H, t);
  rect(0, 16, W, 52, 'rgba(10,4,20,.85)');
  txt('BONUS', 90, 20, '#ffd23f', 'center', 16); txt('ŞAH MAT = PUAN x2', 90, 40, '#fff', 'center');
  txt('HAK: ' + C.tries, 90, 54, '#ff6ad5', 'center', 6, null);
  rect(BX - 3, BY - 3, SQ * 8 + 6, SQ * 8 + 6, '#1a1020'); rect(BX - 2, BY - 2, SQ * 8 + 4, SQ * 8 + 4, '#d4a83a');
  const mv = C.sel ? moves(C.sel) : [];
  for (let f = 0; f < 8; f++) for (let r = 0; r < 8; r++) {
    const x = BX + f * SQ, y = BY + (7 - r) * SQ;
    rect(x, y, SQ, SQ, (f + r) % 2 ? '#c9b6e4' : '#6b4f9a');
    if (C.sel && C.sel.f === f && C.sel.r === r) rect(x, y, SQ, SQ, 'rgba(255,210,63,.7)');
  }
  if (C.state === 'win' && Math.floor(t * 4) % 2 === 0) rect(BX + 7 * SQ, BY, SQ, SQ, '#ff4d6d');
  for (const p of C.B) drawPiece(p, BX + p.f * SQ + 1, BY + (7 - p.r) * SQ + 1);
  for (const [f, r] of mv) circ(BX + f * SQ + 10, BY + (7 - r) * SQ + 10, 3, 'rgba(60,255,110,.85)');
  for (let k = 0; k < 8; k++) { txt('abcdefgh'[k], BX + k * SQ + 10, BY + SQ * 8 + 4, '#b8a8d8', 'center', 6, null); txt(String(8 - k), BX - 7, BY + k * SQ + 7, '#b8a8d8', 'center', 6, null); }
  rect(4, 252, W - 8, 62, '#f4efe6'); rect(6, 254, W - 12, 58, '#120a20');
  wrapText(C.msg, W - 24).forEach((l, k) => txt(l, 12, 262 + k * 12, C.state === 'win' ? '#7ee08a' : C.state === 'lose' ? '#ff4d6d' : '#fff', 'left', 8, null));
  if (C.state !== 'play' && C.t > .8 && Math.floor(t * 2) % 2 === 0) txt('DEVAM', 166, 300, '#ffd23f', 'right', 8, null);
}

// ======= DÖNGÜ =======
let last = performance.now() / 1000;
function update(dt) {
  sceneT += dt;
  if (scene === 'story') story.chars += dt * 40;
  if (scene === 'chess') C.t += dt;
  if (scene === 'end') for (const c of confetti) { c.y += c.v * dt; if (c.y > H) { c.y = -4; c.x = Math.random() * W; } }
  if (scene !== 'play') return;
  schedule();
  const st = now() - P.start;
  if (P.phase === 'play') {
    for (const n of P.notes) if (!n.judged && st - n.t > (P.i === 0 ? .2 : .22)) { n.judged = true; onMiss(); P.i === 0 ? pop('KAÇTI', 40, PANEL - 170, '#ff4d6d') : pop('KAÇTI', LANE_X[n.lane], HITY - 22, '#8a7ab8'); }
    if (P.i === 1) while (P.ri < P.notes.length && P.notes[P.ri].t < st) { P.rival += .66; if (P.ri % 2 === 0) puff(140, SCN1 - 6 - 86 + 26, -1, 4, P.ri % 6 === 0); P.ri++; }
    if (st > P.endTime) finish();
  }
  for (let i = 0; i < 3; i++) { P.flash[i] = Math.max(0, P.flash[i] - dt * 5); P.pressed[i] -= dt; }
  if (P.meter) P.meter.life -= dt;
  P.jump = Math.max(0, P.jump - dt); P.light = Math.max(0, P.light - dt * 3); if (P.net) P.net = Math.max(0, P.net - dt);
  for (const p of P.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .97; if (p.grow) p.r += p.grow * dt; p.life -= dt; }
  P.parts = P.parts.filter(p => p.life > 0);
  for (const p of P.pops) p.life -= dt; P.pops = P.pops.filter(p => p.life > 0);
}
function loop() {
  const t = performance.now() / 1000, dt = Math.min(.05, t - last); last = t;
  update(dt);
  g.imageSmoothingEnabled = false; g.clearRect(0, 0, W, H);
  if (scene === 'title') renderTitle(t);
  else if (scene === 'story') { renderStory(t); hud(); }
  else if (scene === 'play') renderPlay(t);
  else if (scene === 'chess') renderChess(t);
  else renderEnd(t);
  requestAnimationFrame(loop);
}
loop();
</script>
